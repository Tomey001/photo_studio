{% extends 'base.html' %}

{% block title %}Book an Appointment — LensCraft Studio{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-7">

        <h2 class="fw-bold mb-1 text-center">
            <i class="bi bi-calendar-plus me-2"></i>Book an Appointment
        </h2>
        <p class="text-muted text-center mb-4">Fill in the form below and we will confirm your booking by email.</p>

        <div class="booking-card">
            <!-- The form posts to the /book route in Flask -->
            <form method="POST" action="{{ url_for('book') }}">

                <!-- Customer Name -->
                <div class="mb-3">
                    <label for="customer_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="customer_name"
                           name="customer_name" placeholder="e.g. Bless Daniel Tomey"
                           required>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email"
                           name="email" placeholder="e.g. bless@email.com"
                           required>
                </div>

                <!-- Phone -->
                <div class="mb-3">
                    <label for="phone" class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phone"
                           name="phone" placeholder="e.g. 0244123456"
                           required>
                </div>

                <!-- Service Type -->
                <div class="mb-3">
                    <label for="service" class="form-label">Photography Service</label>
                    <select class="form-select" id="service" name="service" required>
                        <option value="" disabled selected>-- Select a service --</option>
                        <option value="Portrait Session">Portrait Session</option>
                        <option value="Wedding Photography">Wedding Photography</option>
                        <option value="Corporate Headshots">Corporate Headshots</option>
                        <option value="Birthday & Anniversaries">Birthday & Anniversaries</option>
                        <option value="Product Photography">Product Photography</option>
                        <option value="Graduation Photos">Graduation Photos</option>
                        <option value="Events & Celebrations">Events & Celebrations</option>
                        <option value="Family Milestones">Family Milestones</option>
                        <option value="Funerals">Funeral Coverage</option>
                    </select>
                </div>

                <!-- Date and Time (side by side) -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="date" class="form-label">Preferred Date</label>
                        <input type="date" class="form-control" id="date"
                               name="date" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="time" class="form-label">Preferred Time</label>
                        <select class="form-select" id="time" name="time" required>
                            <option value="" disabled selected>-- Select time --</option>
                            <option value="09:00">09:00 AM</option>
                            <option value="10:00">10:00 AM</option>
                            <option value="11:00">11:00 AM</option>
                            <option value="12:00">12:00 PM</option>
                            <option value="13:00">01:00 PM</option>
                            <option value="14:00">02:00 PM</option>
                            <option value="15:00">03:00 PM</option>
                            <option value="16:00">04:00 PM</option>
                        </select>
                        <!-- Small helper text that updates as we check availability -->
                        <div id="availabilityHint" class="form-text mt-1"></div>
                    </div>
                </div>

                <!-- Additional Notes -->
                <div class="mb-4">
                    <label for="notes" class="form-label">Additional Notes <span class="text-muted">(optional)</span></label>
                    <textarea class="form-control" id="notes" name="notes"
                              rows="3" placeholder="Any special requests or details..."></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-book">
                    <i class="bi bi-send-fill me-2"></i>Confirm Booking
                </button>

            </form>
        </div>

    </div>
</div>

<!-- ===== Feature 3: Real-time availability ===== -->
<script>
    const dateInput = document.getElementById('date');
    const timeSelect = document.getElementById('time');
    const hint = document.getElementById('availabilityHint');

    // 1) Prevent selecting past dates (this was here before).
    const today = new Date().toISOString().split('T')[0];
    dateInput.setAttribute('min', today);

    // 2) Remember each time option's original label so we can restore it
    //    when the customer switches to a different date.
    const originalLabels = {};
    for (const opt of timeSelect.options) {
        originalLabels[opt.value] = opt.textContent;
    }

    // 3) Whenever the date changes, ask the server which times are taken.
    dateInput.addEventListener('change', updateAvailability);

    async function updateAvailability() {
        const chosenDate = dateInput.value;

        // Reset every real slot back to normal (enabled + original label).
        for (const opt of timeSelect.options) {
            if (opt.value === "") continue;   // skip the "-- Select time --" placeholder
            opt.disabled = false;
            opt.textContent = originalLabels[opt.value];
        }
        hint.textContent = "";
        hint.className = "form-text mt-1";

        if (!chosenDate) return;

        try {
            // Ask our backend information desk for the booked times on this date.
            const res = await fetch(`/api/booked-times?date=${chosenDate}`);
            const data = await res.json();
            const booked = data.booked || [];

            // Grey out (disable) any slot that is already taken.
            for (const opt of timeSelect.options) {
                if (opt.value !== "" && booked.includes(opt.value)) {
                    opt.disabled = true;
                    opt.textContent = originalLabels[opt.value] + " (Booked)";
                    // If the customer had picked a slot that is now booked, clear it.
                    if (timeSelect.value === opt.value) {
                        timeSelect.value = "";
                    }
                }
            }

            // Friendly hint under the dropdown.
            if (booked.length === 0) {
                hint.textContent = "All time slots are available on this date.";
                hint.className = "form-text mt-1 text-success";
            } else {
                hint.textContent = booked.length + " slot(s) already booked on this date are greyed out.";
                hint.className = "form-text mt-1 text-warning";
            }
        } catch (err) {
            // If the check fails (e.g. no connection), we simply leave all slots
            // enabled. The server-side double-booking check is still the real guard.
            console.error('Availability check failed:', err);
        }
    }
</script>

{% endblock %}
